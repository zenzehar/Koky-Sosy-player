name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      # Application-owned TV OAuth credential, NOT a user's Google credential.
      GOOGLE_TV_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_TV_OAUTH_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref == 'fix/v0.1.11.75-passive-seek-caching-and-skip-dispatch' && github.head_ref || '' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Fail before compiling: rerunning a publish-only job does not rebuild the APK.
      - name: Validate TV OAuth before compilation
        run: |
          if [ -z "$GOOGLE_TV_OAUTH_CLIENT_SECRET" ]; then
            echo "::error::Missing GOOGLE_TV_OAUTH_CLIENT_SECRET. Add the Actions repository secret and rerun the entire workflow."
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: soky-iptv-pro-tv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # Only this repo-owned, explicitly named alpha branch can publish a public
  # prerelease APK. Fork pull requests never get write access or a release path.
  publish-tv-alpha:
    name: Publish direct APK
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/v0.1.11.75-passive-seek-caching-and-skip-dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify application OAuth setup before publishing
        env:
          GOOGLE_TV_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_TV_OAUTH_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_TV_OAUTH_CLIENT_SECRET" ]; then
            echo "::error::Repository Actions secret GOOGLE_TV_OAUTH_CLIENT_SECRET is required for a usable TV Google sign-in APK."
            exit 1
          fi

      - name: Retrieve assembled APK
        uses: actions/download-artifact@v4
        with:
          name: soky-iptv-pro-tv-debug-apk
          path: apk

      - name: Publish unapproved prerelease on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -s apk/app-debug.apk
          # The real release asset and downloaded filename MUST include the version.
          mv apk/app-debug.apk apk/Soky_IPTV_Pro_v0.1.11.75.apk
          gh release create v0.1.11.75-passive-seek-caching-and-skip-dispatch \
            "apk/Soky_IPTV_Pro_v0.1.11.75.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Soky IPTV Pro v0.1.11.75 Passive Thumbnail Cache and Skip Dispatch" \
            --notes "v0.1.11.75 EXPERIMENTAL Android TV prerelease. Regressions: both 10-second skip timers now have an independent state-driven completion action in VLC and Media3 in addition to the countdown callback. Intro dispatches precisely its recorded intro END; credits dispatches the confirmed next episode only, never the series/title screen. Action cancellation remains episode scoped. Network-supported progressive VOD now builds a 96-scene progressive 160x90 whole-video contact sheet passively while playing, starting with 24 broadly spaced samples, adding denser refinement and prioritising scrub targets. Previously reached frames remain in a separate 24-frame cache (~8MiB total bitmaps). No active player seeking, second full player or unbounded caching, and native VLC engine unchanged. Unsupported/protected/range-blocked streams cannot guarantee unseen-time thumbnails; approximate keyframes are explicitly labeled. While buffering, the loading indicator replaces Play/Pause with 100% transparent background and no button panel/border in both themes and hidden-control overlay. Netflix-like seeking cursor is a red dot with no frame or focus halo. v59 gold and v71 temporary milestone remain untouched. Real Android TV and Firestick regression checks required." --prerelease
