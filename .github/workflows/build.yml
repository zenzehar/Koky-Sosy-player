name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      # Application-owned TV OAuth credential, NOT a user's Google credential.
      GOOGLE_TV_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_TV_OAUTH_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref == 'experiment/v0.1.11.35-ts-byte-index-seeking' && github.head_ref || '' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Fail before compiling: rerunning a publish-only job does not rebuild the APK.
      - name: Validate TV OAuth before compilation
        run: |
          if [ -z "$GOOGLE_TV_OAUTH_CLIENT_SECRET" ]; then
            echo "::error::Missing GOOGLE_TV_OAUTH_CLIENT_SECRET. Add the Actions repository secret and rerun the entire workflow."
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: soky-iptv-pro-tv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # Only this repo-owned, explicitly named alpha branch can publish a public
  # prerelease APK. Fork pull requests never get write access or a release path.
  publish-tv-alpha:
    name: Publish direct APK
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'experiment/v0.1.11.35-ts-byte-index-seeking'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify application OAuth setup before publishing
        env:
          GOOGLE_TV_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_TV_OAUTH_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_TV_OAUTH_CLIENT_SECRET" ]; then
            echo "::error::Repository Actions secret GOOGLE_TV_OAUTH_CLIENT_SECRET is required for a usable TV Google sign-in APK."
            exit 1
          fi

      - name: Retrieve assembled APK
        uses: actions/download-artifact@v4
        with:
          name: soky-iptv-pro-tv-debug-apk
          path: apk

      - name: Publish unapproved prerelease on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -s apk/app-debug.apk
          gh release create v0.1.11.35-soky-ts-byte-index-seek \
            "apk/app-debug.apk#Soky_IPTV_Pro_v0.1.11.35_TS_Byte_Index_Test.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Soky IPTV Pro v0.1.11.35 indexed TS byte seek TV experiment" \
            --notes "UNAPPROVED TV TEST: Seek Solution 4 (independent TS byte index). User reports speculative time correction v29-v34 caused random jumps and Media3 cannot decode provider streams. Based on v32 known functional VLC playback and never uses Media3 for seeking. For HTTP byte-range seekable .ts VOD only, after >=20s healthy playback over sufficiently fast unmetered Wi-Fi/Ethernet, perform one strictly sequential bounded nine-sample TS video-PES PTS HTTP 206 index (~576KiB total). Require identical stable file size and video PID and monotonic credible timestamps; refuse discontinuities, live, HLS/MKV/MP4, range-less or slow links. Use VLC MPEG-TS native ts-seek-percent option and player.setPosition() with an evidence-based time-to-BYTE fraction, bypassing unreliable provider PCR time-index. Do NOT use video length to convert to a percentage. No automatic trial-error native seeks, no hidden retry loops or other decoder. If indexed byte seek actually lands >25s away it disables itself for the session and returns to ordinary absolute time seeking. Timeline may show ~indexed last video timestamp as evidence, not verified EOF. Other formats keep earlier adaptive time seeking without learned commands/automatic correction. All operations strictly off playback/UI thread, index capped <=576KiB and no full movie downloads. Preserve v30 D-pad visible/hidden focus, hardware Play/Pause and v31 seek-buffering controls; catalogue, sync/Drive/LAN, Live unchanged and untested. Previous stable v27 and Seek Solutions 1-3 remain available. Real-TV verification mandatory; do not promote without proof." --prerelease
