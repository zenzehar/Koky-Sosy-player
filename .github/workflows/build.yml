name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      # Application-owned TV OAuth credential, NOT a user's Google credential.
      GOOGLE_TV_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_TV_OAUTH_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref == 'fix/v0.1.11.84-tv-navigation-performance' && github.head_ref || '' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Fail before compiling: rerunning a publish-only job does not rebuild the APK.
      - name: Validate TV OAuth before compilation
        run: |
          if [ -z "$GOOGLE_TV_OAUTH_CLIENT_SECRET" ]; then
            echo "::error::Missing GOOGLE_TV_OAUTH_CLIENT_SECRET. Add the Actions repository secret and rerun the entire workflow."
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: soky-iptv-pro-tv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # Only this repo-owned, explicitly named alpha branch can publish a public
  # prerelease APK. Fork pull requests never get write access or a release path.
  publish-tv-alpha:
    name: Publish direct APK
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/v0.1.11.84-tv-navigation-performance'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify application OAuth setup before publishing
        env:
          GOOGLE_TV_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_TV_OAUTH_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_TV_OAUTH_CLIENT_SECRET" ]; then
            echo "::error::Repository Actions secret GOOGLE_TV_OAUTH_CLIENT_SECRET is required for a usable TV Google sign-in APK."
            exit 1
          fi

      - name: Retrieve assembled APK
        uses: actions/download-artifact@v4
        with:
          name: soky-iptv-pro-tv-debug-apk
          path: apk

      - name: Publish unapproved prerelease on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -s apk/app-debug.apk
          # The real release asset and downloaded filename MUST include the version.
          mv apk/app-debug.apk apk/Soky_IPTV_Pro_v0.1.11.84.apk
          gh release create v0.1.11.84-tv-navigation-performance \
            "apk/Soky_IPTV_Pro_v0.1.11.84.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Soky IPTV Pro v0.1.11.84 TV Navigation Performance Candidate" \
            --notes "v0.1.11.84 EXPERIMENTAL TV navigation performance release, based directly on temporary milestone v0.1.11.83, which remains protected. UI changes: eager full Display/Playback Settings column replaced by lazy keyed section list; duplicated RadioButton focus actions removed from rows; arbitrary 180ms category and 500ms poster click suppression removed (native single KeyUp remains guarded). Background work changes: WorkManager movie/series/live import progress writes coalesced to integer percentage and at most one update per 160ms, and full catalogue gate fractions quantized to whole percentage to reduce Room writes, Flow invalidations and global recomposition. Optional EPG re-normalization postponed 2 seconds after startup to avoid competing with first menu interactions. Debug APK is now optimized through R8 using the SAME debug application ID and signing configuration, with existing Keep/Consumer rules for Room, Xtream serialization and native dependencies. New OFF-by-default input-to-next-frame diagnostics HUD in Display/Playback Settings reports mean, p95 and >50ms samples so actual TV behaviour can be verified; no frame instrumentation while Off. Auth/login flow, thumbnail algorithms, VLC/Media3 playback, seek/marker buttons, content refresh and error-focus fixes remain unchanged. R8-obfuscated code and UI responsiveness still require real Android TV/Fire TV smoke testing; do NOT promote over v79 gold or v83 temporary milestone without acceptance." --prerelease
