name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      signing_ready: ${{ steps.signing.outputs.configured }}
      app_version: ${{ steps.version.outputs.app_version }}
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      GOOGLE_TV_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_TV_OAUTH_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate TV OAuth before compilation
        run: |
          if [ -z "$GOOGLE_TV_OAUTH_CLIENT_SECRET" ]; then
            echo "::error::Missing GOOGLE_TV_OAUTH_CLIENT_SECRET."
            exit 1
          fi

      - name: Identify APK version
        id: version
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION"
          echo "app_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure permanent signing if available
        id: signing
        env:
          SOKY_SIGNING_BUNDLE: ${{ secrets.SOKY_SIGNING_BUNDLE }}
        run: python3 scripts/prepare_signing.py

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify permanent APK certificate
        if: steps.signing.outputs.configured == 'true'
        run: python3 scripts/verify_apk_signing.py app/build/outputs/apk/debug/app-debug.apk

      # Temporary-key test builds are never offered for installation.
      - name: Upload permanently signed debug APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: soky-iptv-pro-permanently-signed-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  publish-tv-alpha:
    name: Publish verified signed TV test APK
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'fix/v') &&
      needs.build.outputs.signing_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Retrieve VERIFIED signed APK
        uses: actions/download-artifact@v4
        with:
          name: soky-iptv-pro-permanently-signed-debug-apk
          path: apk

      - name: Publish TV test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
          APP_VERSION: ${{ needs.build.outputs.app_version }}
        run: |
          set -euo pipefail
          test -s apk/app-debug.apk
          test -n "$APP_VERSION"
          NAME="Soky_IPTV_Pro_v$APP_VERSION.apk"
          mv apk/app-debug.apk "apk/$NAME"
          gh release create "v$APP_VERSION" "apk/$NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Soky IPTV Pro v$APP_VERSION - Permanently Signed TV Test" \
            --notes "Permanently signed developer APK, certificate checked against repository pin. TV hardware validation is required before merging. The application ID remains tv.sokyiptv.pro.debug. Previous temporary-key installs require one verified backup and migration." \
            --prerelease

  publish-v92-rollback-companion:
    name: Build signed v91-code rollback companion (Android forward version)
    needs: [build, publish-tv-alpha]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'fix/v0.1.11.92-') &&
      needs.publish-tv-alpha.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - source_tag: v0.1.11.90-provider-validation-recovery
            source_version: 0.1.11.90-provider-validation-recovery
            source_code: 110
          - source_tag: v0.1.11.91-navigation-smoothness
            source_version: 0.1.11.91-navigation-smoothness
            source_code: 111
    permissions:
      contents: write
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      GOOGLE_TV_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_TV_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source_tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify exact immutable old source and make rollback updateable
        run: |
          set -euo pipefail
          ORIGINAL_CODE="${{ matrix.source_code }}"
          ORIGINAL_VERSION="${{ matrix.source_version }}"
          grep -q "versionCode = $ORIGINAL_CODE" app/build.gradle.kts
          grep -q "versionName = \"$ORIGINAL_VERSION\"" app/build.gradle.kts
          # Android forbids smaller versionCode. This builds the unchanged old
          # CODE with 113 > v92's 112; the next update needs versionCode >= 114.
          sed -i "s/versionCode = $ORIGINAL_CODE/versionCode = 113/" app/build.gradle.kts
          sed -i "s/versionName = \"$ORIGINAL_VERSION\"/versionName = \"0.1.11.92-24h-rollback-restored-to-$ORIGINAL_VERSION\"/" app/build.gradle.kts
      - name: Require permanent signing certificate
        env:
          SOKY_SIGNING_BUNDLE: ${{ secrets.SOKY_SIGNING_BUNDLE }}
        run: python3 scripts/prepare_signing.py --required
      - name: Compile and test old-code recovery APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Verify immutable trusted signing identity
        run: python3 scripts/verify_apk_signing.py app/build/outputs/apk/debug/app-debug.apk
      - name: Attach rollback APK to matching v92 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE="Soky_IPTV_Pro_Rollback_to_v${{ matrix.source_version }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$FILE"
          gh release upload v0.1.11.92-24h-rollback "$FILE" --repo "$GITHUB_REPOSITORY" --clobber

