name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      # Application-owned TV OAuth credential, NOT a user's Google credential.
      GOOGLE_TV_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_TV_OAUTH_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref == 'fix/v0.1.11.47-legacy-v019-playback-seeking' && github.head_ref || '' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Fail before compiling: rerunning a publish-only job does not rebuild the APK.
      - name: Validate TV OAuth before compilation
        run: |
          if [ -z "$GOOGLE_TV_OAUTH_CLIENT_SECRET" ]; then
            echo "::error::Missing GOOGLE_TV_OAUTH_CLIENT_SECRET. Add the Actions repository secret and rerun the entire workflow."
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: soky-iptv-pro-tv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # Only this repo-owned, explicitly named alpha branch can publish a public
  # prerelease APK. Fork pull requests never get write access or a release path.
  publish-tv-alpha:
    name: Publish direct APK
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/v0.1.11.47-legacy-v019-playback-seeking'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify application OAuth setup before publishing
        env:
          GOOGLE_TV_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_TV_OAUTH_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_TV_OAUTH_CLIENT_SECRET" ]; then
            echo "::error::Repository Actions secret GOOGLE_TV_OAUTH_CLIENT_SECRET is required for a usable TV Google sign-in APK."
            exit 1
          fi

      - name: Retrieve assembled APK
        uses: actions/download-artifact@v4
        with:
          name: soky-iptv-pro-tv-debug-apk
          path: apk

      - name: Publish unapproved prerelease on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -s apk/app-debug.apk
          # The real release asset and downloaded filename MUST include the version.
          mv apk/app-debug.apk apk/Soky_IPTV_Pro_v0.1.11.47.apk
          gh release create v0.1.11.47-v019-native-vlc-restored \
            "apk/Soky_IPTV_Pro_v0.1.11.47.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Soky IPTV Pro v0.1.11.47 Original v0.1.9 VLC Restored" \
            --notes "v0.1.11.47 TEST BUILD: restore only the original v0.1.9 native LibVLC playback and seeking mechanisms from the milestone/v0.1.9-tv-approved and hybrid v0.1.11.0 rollback. Native LibVLC remains 3.6.1; startup is again fixed 1400ms VLC network cache, native MediaPlayer.setTime(ms) one-shot seeks, declared-duration clamping, original D-pad accelerated hold, initial position seek, and native clock polling. Removes later VlcSeekClock, VlcNativeSeekCorrection, post-seek recovery, tail probing, and TV decoder rebind from the VLC player. Modern television transport visuals, episode navigation/autoplay, screensaver pause compatibility and passive playback diagnostics retained. Critically preserves the confirmed v0.1.11.45/v0.1.11.46 one-file Google Drive history sync, profile-free merge, episode discovery, and exit-only asynchronous cloud sync WITHOUT edits. Playback buffer presets remain for Media3; restored VLC ignores them and uses fixed 1400ms per the original. This is a regression experiment and may restore old seek limits on underreported-duration streams; user requested fidelity to original. Run 20-minute VOD/episode playback test, direct 10s seek and hold tests, Back while buffering, screensaver, cross-TV resume sync. versionCode 67. Actual download filename Soky_IPTV_Pro_v0.1.11.47.apk. Debug signing certificate may block upgrade across versions. Hardware validation pending." --prerelease
