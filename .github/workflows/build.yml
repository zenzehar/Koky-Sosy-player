name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      # Application-owned TV OAuth credential, NOT a user's Google credential.
      GOOGLE_TV_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_TV_OAUTH_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref == 'fix/v0.1.11.53-v51-back-crash-firetv-sync-paused' && github.head_ref || '' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Fail before compiling: rerunning a publish-only job does not rebuild the APK.
      - name: Validate TV OAuth before compilation
        run: |
          if [ -z "$GOOGLE_TV_OAUTH_CLIENT_SECRET" ]; then
            echo "::error::Missing GOOGLE_TV_OAUTH_CLIENT_SECRET. Add the Actions repository secret and rerun the entire workflow."
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: soky-iptv-pro-tv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # Only this repo-owned, explicitly named alpha branch can publish a public
  # prerelease APK. Fork pull requests never get write access or a release path.
  publish-tv-alpha:
    name: Publish direct APK
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/v0.1.11.53-v51-back-crash-firetv-sync-paused'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify application OAuth setup before publishing
        env:
          GOOGLE_TV_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_TV_OAUTH_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_TV_OAUTH_CLIENT_SECRET" ]; then
            echo "::error::Repository Actions secret GOOGLE_TV_OAUTH_CLIENT_SECRET is required for a usable TV Google sign-in APK."
            exit 1
          fi

      - name: Retrieve assembled APK
        uses: actions/download-artifact@v4
        with:
          name: soky-iptv-pro-tv-debug-apk
          path: apk

      - name: Publish unapproved prerelease on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -s apk/app-debug.apk
          # The real release asset and downloaded filename MUST include the version.
          mv apk/app-debug.apk apk/Soky_IPTV_Pro_v0.1.11.53.apk
          gh release create v0.1.11.53-back-crash-firetv-sync-paused \
            "apk/Soky_IPTV_Pro_v0.1.11.53.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Soky IPTV Pro v0.1.11.53 Back Stability and Fire TV" \
            --notes "v0.1.11.53 TEST BUILD versionCode 73. Base: v0.1.11.51, not the experimental v52 adaptive cache build. Prioritize frequent Back-from-video crashes: one-shot guarded navigation, native VLC release ONLY on AndroidView.onRelease, suppress callbacks and polling after disposal. Buffering cancels the existing five-second controls hide timer without forcing hidden controls visible. Remove buffering percent, cache indicators and premature stall overlays. Delay transient startup error UI for seven seconds, cancel when stream recovers. Restore stable 1400ms VLC native cache (no v52 statistical monitoring, predictive cache tuning or extra network probes). Retain translucent elapsed/total pill. Add explicit launcher activity icon and 16:9 banner for Fire TV, also keep Android TV LEANBACK and regular Android launcher entries. TEMPORARILY DISABLE Google Drive automatic/manual sync and LAN/NAS history sync; stored history, pairing and Google credentials remain; local Room Continue Watching works. Draft PR, no golden/main merge. User must test repeated Back, initial provider VOD load, Firestick visibility, 15-minute playback and local resume. Device QA pending, debug signed." --prerelease
