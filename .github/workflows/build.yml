name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      # Application-owned TV OAuth credential, NOT a user's Google credential.
      GOOGLE_TV_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_TV_OAUTH_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref == 'fix/v0.1.11.36-guarded-fallback-seek' && github.head_ref || '' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Fail before compiling: rerunning a publish-only job does not rebuild the APK.
      - name: Validate TV OAuth before compilation
        run: |
          if [ -z "$GOOGLE_TV_OAUTH_CLIENT_SECRET" ]; then
            echo "::error::Missing GOOGLE_TV_OAUTH_CLIENT_SECRET. Add the Actions repository secret and rerun the entire workflow."
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: soky-iptv-pro-tv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # Only this repo-owned, explicitly named alpha branch can publish a public
  # prerelease APK. Fork pull requests never get write access or a release path.
  publish-tv-alpha:
    name: Publish direct APK
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/v0.1.11.36-guarded-fallback-seek'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify application OAuth setup before publishing
        env:
          GOOGLE_TV_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_TV_OAUTH_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_TV_OAUTH_CLIENT_SECRET" ]; then
            echo "::error::Repository Actions secret GOOGLE_TV_OAUTH_CLIENT_SECRET is required for a usable TV Google sign-in APK."
            exit 1
          fi

      - name: Retrieve assembled APK
        uses: actions/download-artifact@v4
        with:
          name: soky-iptv-pro-tv-debug-apk
          path: apk

      - name: Publish unapproved prerelease on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -s apk/app-debug.apk
          gh release create v0.1.11.36-soky-guarded-seek-fallback \
            "apk/app-debug.apk#Soky_IPTV_Pro_v0.1.11.36_Guarded_Fallback_Test.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Soky IPTV Pro v0.1.11.36 guarded VLC seek fallback TV test" \
            --notes "UNAPPROVED TV TEST based directly on v0.1.11.35 TS byte seeking. Seek Solution 4 byte-index remains the top-priority method whenever validated for progressive direct TS VOD. If the byte index is absent/disabled or selected target is outside indexed range, VLC's normal absolute setTime(targetMilliseconds,false) remains available. This build introduces GuardedSeekFallback, an intentionally very conservative ONE-SHOT correction: only targets at least 60s in and at least 25s from current position, only when the player reports a credible known duration >=5min, only while target is strictly earlier than declared end minus max(90 seconds, 12.5% runtime). Both original intended target AND corrective command must remain under this limit. At least two stable advancing native clock readings are required after buffering; correct a moderate error by half and at most 12 seconds; very large jump >35s, repeated wrong correction, changed metadata, stale clock, unknown EOF or provider-reported end entirely suppress corrective seeking. One failed retry or huge failure disables fallback correction for current video, but never blocks user manual seeks beyond false end. Rapid +/-10 seconds NEVER trigger delayed corrective jumps. Controls remain visible through post-seek buffering and countdown starts only after native playback advances. No Media3 fallback or automatic engine change. Watch progress only saved after seek playback confirmation, no sync/Google Drive/LAN/Live/catalogue changes; they are not tested. Diagnoses guarded skipping/retries/failures with numeric codes, never provider URLs/credentials. Tests cover unknown/bad durations, near and beyond declared end, rapid D-pad taps, buffering, native clock continuity, cap, previous request invalidation and session lockout. Release is UNAPPROVED until physical TV tested; v35 and stable v27 remain untouched." --prerelease
