name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      # Application-owned TV OAuth credential, NOT a user's Google credential.
      GOOGLE_TV_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_TV_OAUTH_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref == 'fix/v0.1.11.31-adaptive-seek-buffer-controls' && github.head_ref || '' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Fail before compiling: rerunning a publish-only job does not rebuild the APK.
      - name: Validate TV OAuth before compilation
        run: |
          if [ -z "$GOOGLE_TV_OAUTH_CLIENT_SECRET" ]; then
            echo "::error::Missing GOOGLE_TV_OAUTH_CLIENT_SECRET. Add the Actions repository secret and rerun the entire workflow."
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: soky-iptv-pro-tv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # Only this repo-owned, explicitly named alpha branch can publish a public
  # prerelease APK. Fork pull requests never get write access or a release path.
  publish-tv-alpha:
    name: Publish direct APK
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/v0.1.11.31-adaptive-seek-buffer-controls'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify application OAuth setup before publishing
        env:
          GOOGLE_TV_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_TV_OAUTH_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_TV_OAUTH_CLIENT_SECRET" ]; then
            echo "::error::Repository Actions secret GOOGLE_TV_OAUTH_CLIENT_SECRET is required for a usable TV Google sign-in APK."
            exit 1
          fi

      - name: Retrieve assembled APK
        uses: actions/download-artifact@v4
        with:
          name: soky-iptv-pro-tv-debug-apk
          path: apk

      - name: Publish unapproved prerelease on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -s apk/app-debug.apk
          gh release create v0.1.11.31-soky-adaptive-vod-timeline \
            "apk/app-debug.apk#Soky_IPTV_Pro_v0.1.11.31_Adaptive_Seek_Controls_Test.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Soky IPTV Pro v0.1.11.31 adaptive seek timeline and buffering controls" \
            --notes "UNAPPROVED TV TEST. Based on v0.1.11.30 player branch, no catalogue or Google Drive/LAN synchronization changes. The reported stream runtime can be severely understated and cannot universally be recovered at startup for every IPTV provider/container; do NOT claim to know actual EOF. Adaptive timeline dynamically extends beyond unreliable declared length as playback/preview nears it, with ~ prefix indicating display estimate rather than true duration; seeking remains absolute milliseconds and bounded native VLC correction. While a user-initiated seek is buffering or native playback time has not advanced, keep the transport controls visible. Start the five-second auto-hide countdown only after native playback moves; ordinary buffering without a user seek never opens controls. Applies to VLC and Media3. Do not mark watch history finished purely because provider's erroneous reported runtime is near 95%. No changes to LAN, Google Drive, Movies/Series, Live. Unit tests included; physical-TV seek near declared end, post-seek buffering, hidden/visible D-pad focus, watch progress and TV recovery must be tested before approval." --prerelease
