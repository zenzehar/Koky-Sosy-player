name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      rebrand_changed: ${{ steps.rebrand.outputs.changed }}
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref == 'feat/soky-iptv-pro-full-rebrand' && github.head_ref || '' }}

      - name: Rebrand and generate Android assets (trusted repo branch only)
        id: rebrand
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.head_ref == 'feat/soky-iptv-pro-full-rebrand'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages Pillow cairosvg
          python3 tools/apply_soky_rebrand.py
          python3 tools/prepare_soky_assets.py
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git config user.name "Soky CI Rebrand"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Complete automated Soky IPTV Pro source and asset rebrand"
            git push origin HEAD:feat/soky-iptv-pro-full-rebrand
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: koky-sosy-player-tv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # Only this repo-owned, explicitly named alpha branch can publish a public
  # prerelease APK. Fork pull requests never get write access or a release path.
  publish-tv-alpha:
    name: Publish direct APK
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/soky-iptv-pro-full-rebrand' &&
      needs.build.outputs.rebrand_changed != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Retrieve assembled APK
        uses: actions/download-artifact@v4
        with:
          name: koky-sosy-player-tv-debug-apk
          path: apk

      - name: Publish unapproved prerelease on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -s apk/app-debug.apk
          gh release create v0.1.11.12-soky-iptv-pro \
            "apk/app-debug.apk#Soky_IPTV_Pro_v0.1.11.12_TV_Alpha.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Soky IPTV Pro v0.1.11.12 complete rebrand (TV approval pending)" \
            --notes "UNAPPROVED REBRAND TEST: Soky IPTV Pro user-facing identity, Android package, file/class names, resources, launcher icon, banner and splash. Package identity differs from the previous app: encrypted credential backup/restore is required. Source includes legally required original GPL copyright notices. Real-TV testing and production signing remain pending." \
            --prerelease
