name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      # OAuth credentials are intentionally NOT injected into public CI artifacts.
      # Configure a private trusted build after approval; APKs cannot keep client secrets.

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: koky-sosy-player-tv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # Only this repo-owned, explicitly named alpha branch can publish a public
  # prerelease APK. Fork pull requests never get write access or a release path.
  publish-tv-alpha:
    name: Publish direct APK
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/v0.1.11.11-startup-refresh'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Retrieve assembled APK
        uses: actions/download-artifact@v4
        with:
          name: koky-sosy-player-tv-debug-apk
          path: apk

      - name: Publish unapproved prerelease on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -s apk/app-debug.apk
          gh release create v0.1.11.11-startup-refresh \
            "apk/app-debug.apk#Koky_Sosy_Player_v0.1.11.11_TV_startup_refresh.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Koky & Sosy v0.1.11.11 TV initial refresh preview (hardware test pending)" \
            --notes "UNAPPROVED TV TEST: initial section refresh on first/new provider launch when Movies/Series stamps are missing, even when legacy global stamp is fresh; Live/Movies/Series onboarding now records successful per-provider stamps. Keeps v0.1.11.10 Live gate and precise seek improvements (device-specific accuracy remains to be validated). Approved v0.1.11.8 protected. Google Drive sync proposed in issue #33, NOT implemented pending OAuth registration. Screensaver remains untested." \
            --prerelease
