name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      # Application-owned TV OAuth credential, NOT a user's Google credential.
      GOOGLE_TV_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_TV_OAUTH_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref == 'fix/v0.1.11.50-streaming-live-import' && github.head_ref || '' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Fail before compiling: rerunning a publish-only job does not rebuild the APK.
      - name: Validate TV OAuth before compilation
        run: |
          if [ -z "$GOOGLE_TV_OAUTH_CLIENT_SECRET" ]; then
            echo "::error::Missing GOOGLE_TV_OAUTH_CLIENT_SECRET. Add the Actions repository secret and rerun the entire workflow."
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: soky-iptv-pro-tv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # Only this repo-owned, explicitly named alpha branch can publish a public
  # prerelease APK. Fork pull requests never get write access or a release path.
  publish-tv-alpha:
    name: Publish direct APK
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/v0.1.11.50-streaming-live-import'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify application OAuth setup before publishing
        env:
          GOOGLE_TV_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_TV_OAUTH_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_TV_OAUTH_CLIENT_SECRET" ]; then
            echo "::error::Repository Actions secret GOOGLE_TV_OAUTH_CLIENT_SECRET is required for a usable TV Google sign-in APK."
            exit 1
          fi

      - name: Retrieve assembled APK
        uses: actions/download-artifact@v4
        with:
          name: soky-iptv-pro-tv-debug-apk
          path: apk

      - name: Publish unapproved prerelease on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -s apk/app-debug.apk
          # The real release asset and downloaded filename MUST include the version.
          mv apk/app-debug.apk apk/Soky_IPTV_Pro_v0.1.11.50.apk
          gh release create v0.1.11.50-direct-live-streaming-import \
            "apk/Soky_IPTV_Pro_v0.1.11.50.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Soky IPTV Pro v0.1.11.50 Direct Live Stream Import" \
            --notes "v0.1.11.50 EXPERIMENTAL FIX for Android14 Live TV refresh failures. Unlike v48/v49, the app no longer materializes the 7,498-channel Live catalogue as a Kotlinx JsonElement tree, or reconstructs one using a fallback parser. Instead get_live_streams is downloaded and parsed DIRECTLY into Channel entries through Android platform android.util.JsonReader(isLenient=true), the same parser and complete-response validation strategy that passed Diagnostic D3 with the user's actual 2.28MB Live response. Unknown vendor metadata skipped; known category, name, stream ID, icon, EPG, number and archive fields read safely. No database import until the JSON array closes successfully and END_DOCUMENT is reached, preventing partial catalogue corruption. Stage-specific messages now distinguish authentication, category download/decoding, channel download/stream decoding, and local database import. Android14 unit tests include a realistic complete 7,498-channel fixture, malformed/truncated bodies, vendor syntax and missing fields. The real provider has not yet been tested in the running app; do not declare fixed until user confirms. v0.1.9 VLC native playback/seek and v0.1.11.46 exit-only Google Drive sync unchanged. Existing TEST-only emulator login prefill maintained on new debug login; production build variant contains no provider embedded login. versionCode70, downloadable file Soky_IPTV_Pro_v0.1.11.50.apk. Do not merge to main/golden and do not remove existing test releases until user confirms cleanup." --prerelease
