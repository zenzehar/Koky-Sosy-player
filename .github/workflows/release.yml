name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish permanently signed APKs
    runs-on: ubuntu-latest
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      GOOGLE_TV_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_TV_OAUTH_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Require and validate permanent signing
        env:
          SOKY_SIGNING_BUNDLE: ${{ secrets.SOKY_SIGNING_BUNDLE }}
        run: python3 scripts/prepare_signing.py --required

      - name: Validate TV OAuth
        run: |
          if [ -z "$GOOGLE_TV_OAUTH_CLIENT_SECRET" ]; then
            echo "::error::Missing GOOGLE_TV_OAUTH_CLIENT_SECRET."
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble signed TV-update and production APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Verify actual APK signing certificates
        run: |
          python3 scripts/verify_apk_signing.py app/build/outputs/apk/debug/app-debug.apk
          APK=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$APK"
          python3 scripts/verify_apk_signing.py "$APK"

      - name: Prepare release assets
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Soky_IPTV_Pro_$TAG-TV-Update.apk"
          RELEASE_APK=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          cp "$RELEASE_APK" "dist/Soky_IPTV_Pro_$TAG-Production.apk"
          cp "$RELEASE_APK" dist/opentv.apk

      - name: Publish verified permanent-key release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            Every APK was signed with the owner's permanent signing key and checked against the pinned certificate.
            TV-Update.apk updates permanent-key-signed tv.sokyiptv.pro.debug builds.
            Production.apk installs the separate tv.sokyiptv.pro application.
            Old v85/v86 ephemeral-key installations are not signature-compatible; migrate app data once.
