name: One-off Android 14 Xtream Diagnostic APK

on:
  pull_request:
    paths:
      - 'diagnostic/**'
      - 'settings.gradle.kts'
      - '.github/workflows/diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'diagnostic/android14-embedded-test-login-d6') }}
    name: Build isolated diagnostic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test diagnostic only
        run: ./gradlew :diagnostic:testDebugUnitTest :diagnostic:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: soky-android14-xtream-diagnostic
          path: diagnostic/build/outputs/apk/debug/diagnostic-debug.apk
          if-no-files-found: error

  publish-diagnostic:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'diagnostic/android14-embedded-test-login-d6' }}
    name: Publish side-by-side diagnostic APK
    needs: build-diagnostic
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: soky-android14-xtream-diagnostic
          path: diagnostic-apk
      - name: Publish separate diagnostic test release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -s diagnostic-apk/diagnostic-debug.apk
          mv diagnostic-apk/diagnostic-debug.apk diagnostic-apk/Soky_Xtream_Diagnostic_v0.1.11.47_D6.apk
          gh release create diagnostic-v0.1.11.47-android14-probe-v6 \
            "diagnostic-apk/Soky_Xtream_Diagnostic_v0.1.11.47_D6.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Soky Xtream API Diagnostics v0.1.11.47 D6 (Embedded Test Provider)" \
            --notes "One-off Android14 Xtream test utility D6: the user expressly requested their test provider credentials be embedded in the diagnostic APK. Embedded provider auto-selected on launch; no manual typing or backup required. User-Agent stays the Soky default. Credentials are only trivially obfuscated in bytecode and MAY BE RECOVERED by anyone with this publicly downloadable binary, even after the release is removed. Not a production build. Manual provider entry, encrypted backup import, safe HTML preview, full JSON validation up to 4MiB with Soky Kotlinx parser, up to 64MiB streaming validation, safe transfer metadata and retry of malformed VOD endpoints remain available. Does NOT modify or replace the main Soky player; separate applicationId tv.sokyiptv.responseprobe. No raw server URL, username or password appears in release notes. Future diagnostic branches should inherit the D6 EmbeddedTestProvider until user says testing is finished. Remove prerelease builds using scripts/cleanup_soky_test_releases.sh once user approves; previously downloaded binaries, Git history, caches and forks cannot be recalled. versionCode 6, downloadable asset Soky_Xtream_Diagnostic_v0.1.11.47_D6.apk." --prerelease
            --prerelease
